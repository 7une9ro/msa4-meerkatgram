spring:
  application:
    name: msa4-meerkatgram
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  output:
    ansi:
      enabled: ALWAYS

# Mybatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*Mapper.xml
  type-aliases-package: com.msa4meerkatgram

# Security & JWT
security:
  jwt:
    secure: ${JWT_SECURE}
    issuer: ${JWT_ISSUER}
    type: JWT
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY}
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY}
    refresh-token-cookie-name: refresh-token
    refresh-token-cookie-expiry: ${JWT_REFRESH_TOKEN_COOKIE_EXPIRY}
    secret: ${JWT_SECRET}
    header-key: Authorization
    scheme: Bearer
    reiss-uri: /api/reissue-token

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  max-age: 3600

# config (정적 파일 저장 경로 - API 서버 내 storage)
file:
  server-uri: ${FILE_SERVER_URI}
  storage-path: ${FILE_STORAGE_PATH}
  profile-path: /files/profiles
  post-path: /files/posts
  allow-extension-list: [
    "image/jpeg",
    "image/jpg",
    "image/webp",
    "image/gif",
    "image/svg",
    "image/png"
  ]

server:
  error:
    include-stacktrace: always
    include-message: always

logging:
  file:
    name: logs/error.log
  level:
    root: never
    com.msa4meerkatgram.controllers: never # 패키지명 변경 및 범위 확장